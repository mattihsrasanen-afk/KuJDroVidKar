<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Kuvakartta Pro - PIP, Muokkaus & Drone</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        :root { --side-width: 330px; --accent: #5db0ff; --selected: #9b59b6; --bg: #111; }
        body, html { margin: 0; padding: 0; height: 100vh; width: 100%; overflow: hidden; background: var(--bg); color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; }
        
        header { padding: 10px 20px; background: #333; display: flex; align-items: center; justify-content: space-between; z-index: 1000; border-bottom: 2px solid #444; }
        #app-wrapper { display: flex; flex: 1; width: 100vw; align-items: stretch; overflow: hidden; }
        
        #left-panel, #right-panel { width: var(--side-width); background: #1a1a1a; display: flex; flex-direction: column; z-index: 10; border-right: 1px solid #444; }
        #right-panel { border-right: none; border-left: 1px solid #444; }
        
        #map-container { flex: 1; position: relative; background: #000; display: flex; }
        #map { flex: 1; height: 100%; width: 100%; }

        .filter-panel { background: #222; padding: 15px; border-bottom: 1px solid #444; }
        .filter-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
        .filter-group { display: flex; gap: 10px; background: #111; padding: 5px 10px; border-radius: 6px; }
        .filter-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        
        /* Popup ja listat */
        .leaflet-popup-content-wrapper { background: #222; color: #fff; border-radius: 8px; padding: 0; overflow: hidden; }
        .leaflet-popup-content { margin: 0; width: 220px !important; }
        .leaflet-popup-tip { background: #222; }
        .adv-popup-header { background: #111; padding: 8px; font-size: 11px; text-align: center; border-bottom: 1px solid #333; word-break: break-all; }
        .adv-popup-img { width: 100%; height: 200px; object-fit: cover; display: block; cursor: pointer; transition: 0.2s; }
        .adv-popup-img:hover { filter: brightness(1.1); }
        .adv-popup-btns { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        
        .adv-btn { width: 100%; border: none; padding: 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; cursor: pointer; text-align: center; }
        .btn-purple { background: #8e44ad; }
        .btn-blue { background: #3498db; }
        .btn-red { background: #e74c3c; }
        .adv-btn:hover { filter: brightness(1.2); }

        .list-item { padding: 8px; border-bottom: 1px solid #333; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.2s ease; }
        .list-item:hover { background: #2a2a2a; }
        .list-item.is-selected { background: var(--selected) !important; font-weight: bold; }
        .list-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        
        footer { padding: 8px 0; background: #222; text-align: center; font-size: 12px; border-top: 1px solid #444; }

        /* LIGHTBOX (Kuvia varten) */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .lb-media { max-width: 90vw; max-height: 80vh; object-fit: contain; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .lb-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: 1px solid #444; font-size: 30px; padding: 15px 20px; cursor: pointer; border-radius: 8px; transition: 0.2s; z-index: 10000; }
        .lb-btn:hover { background: var(--accent); border-color: var(--accent); }
        #lb-prev { left: 30px; }
        #lb-next { right: 30px; }
        #lb-close { position: absolute; top: 20px; right: 30px; background: none; border: none; color: white; font-size: 40px; cursor: pointer; z-index: 10000; transition: color 0.2s; }
        #lb-info { margin-top: 20px; color: #fff; font-size: 16px; text-align: center; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; }

        /* UUSI: VIDEOSOITIN LEIJUVA KARTALLA */
        #video-player-container { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.9); border: 2px solid var(--accent); border-radius: 8px; padding: 10px; z-index: 1000; display: none; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        #video-player-container video { width: 100%; border-radius: 4px; }
        #video-info { margin-top: 5px; font-size: 0.85em; color: #ccc; display: flex; justify-content: space-between; }
        .close-video { background: #e74c3c; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; float: right; margin-bottom: 5px; font-weight:bold;}

        /* UUSI: DRONE-NUOLI */
        .drone-wrapper { width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; }
        .drone-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 25px solid #ffaa00; position: relative; filter: drop-shadow(0 0 2px black); }
        .drone-arrow::after { content: ''; position: absolute; bottom: -32px; left: -12px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 10px solid #1a1a1a; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0;">📸 Kuvakartta Pro</h2>
    <a href="https://paypal.me/MattiHSRasanenAFK" target="_blank" style="color: #ffcc00; text-decoration: none; font-weight: bold;">💰 Lahjoita</a>
</header>

<div id="app-wrapper">
    <div id="left-panel">
        <div style="padding:10px; background:#111; border-bottom:1px solid #444;">📍 Lähialue (<span id="left-count">0</span>)</div>
        <div id="local-file-list" style="overflow-y:auto; flex:1;"></div>
    </div>

    <div id="map-container">
        <div id="map"></div>
        
        <div id="video-player-container">
            <button class="close-video" onclick="suljeVideo()">X</button>
            <div id="video-title" style="font-weight: bold; margin-bottom: 5px;">Video</div>
            <video id="active-video" controls></video>
            <div id="video-info">
                <span id="v-date" style="color:var(--accent); font-weight:bold; margin-right:10px;"></span>
                <span id="v-time">0:00</span>
                <span id="v-speed">0 km/h</span>
                <span id="v-dist">📏 0 m</span>
            </div>
        </div>
    </div>

    <div id="right-panel">
        <div class="filter-panel">
            <h3 style="margin-top:0; font-size:14px; text-align:center;">Kaikki tiedostot</h3>
            <div class="filter-row">
                <div class="filter-group">
                    <label><input type="radio" name="locFilter" value="all" checked onchange="paivitaKartta()"> Kaikki</label>
                    <label><input type="radio" name="locFilter" value="has_loc" onchange="paivitaKartta()"> Sijainti</label>
                    <label><input type="radio" name="locFilter" value="no_loc" onchange="paivitaKartta()"> Ei sij.</label>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-group">
                    <label><input type="radio" name="typeFilter" value="all" checked onchange="paivitaKartta()"> Kaikki</label>
                    <label><input type="radio" name="typeFilter" value="jpg" onchange="paivitaKartta()"> JPG</label>
                    <label><input type="radio" name="typeFilter" value="video" onchange="paivitaKartta()"> Videot</label>
                </div>
            </div>
        </div>
        <div style="padding:10px; background:#111; border-bottom:1px solid #444; border-top:1px solid #444;">🗂️ Lista (<span id="right-count">0</span>)</div>
        <div id="all-file-list" style="overflow-y:auto; flex:1;"></div>
    </div>
</div>

<footer>
    &copy; 2026 Matti Räsänen | GPLv3 | Maanmittauslaitos CC BY 4.0
</footer>

<div id="lightbox">
    <button id="lb-close" onclick="suljeLightbox()" title="Sulje (Esc)">&times;</button>
    <button id="lb-prev" class="lb-btn" onclick="vaihdaKuva(-1)">&#10094;</button>
    <img id="lightbox-img" class="lb-media" src="">
    <button id="lb-next" class="lb-btn" onclick="vaihdaKuva(1)">&#10095;</button>
    <div id="lb-info">Kuva 1 / 1</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

<script>
    // --- LASKUTAFUNKTIOT REITEILLE ---
    function laskeEtaisyys(lat1, lon1, lat2, lon2) {
        const R = 6371e3; 
        const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }

    function laskeSuunta(lat1, lon1, lat2, lon2) {
        const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
        const dl = (lon2-lon1) * Math.PI/180;
        const y = Math.sin(dl) * Math.cos(p2);
        const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
        const brng = Math.atan2(y, x) * 180 / Math.PI;
        return (brng + 360) % 360; 
    }

    // --- KARTAN ALUSTUS ---
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
    
    const map = L.map('map', { center: [62.89, 27.68], zoom: 9, layers: [osmLayer] });
    L.control.layers({"OpenStreetMap": osmLayer, "Ilmakuva": satelliteLayer}, null, { position: 'topleft' }).addTo(map);

    const markerClusterGroup = L.markerClusterGroup({ maxClusterRadius: 50, spiderfyOnMaxZoom: true, zoomToBoundsOnClick: true });
    map.addLayer(markerClusterGroup);

    // --- MUUTTUJAT JA DRONE-IKONI ---
    let kaikkiData = [];
    let tallennetutMerkit = {}; 
    let valittuPolku = null;    
    let reittiViivat = []; // Tallennetaan reitit siivousta varten

    const droneIcon = L.divIcon({
        html: '<div class="drone-wrapper"><div class="drone-arrow" id="drone-pointer"></div></div>',
        className: '', iconSize: [40, 40], iconAnchor: [20, 20] 
    });
    let droneMarker = L.marker([0, 0], { icon: droneIcon });
    let activeVideoData = null;

    // --- DATAN HAKU ---
    fetch('/api/data')
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
            kasitteleData(data);
        })
        .catch(() => {
            console.log("Mock data ladataan testiin (sis. lentoreitin).");
            kasitteleData([
                { path: "kuva1.jpg", name: "2014-10-15.jpg", lat: 62.89, lng: 27.68, type: 'image' },
                { path: "kuva2.jpg", name: "metsa.jpg", lat: 62.89, lng: 27.68, type: 'image' },
                { 
                    path: "drone_video.mp4", name: "Lento yli metsän.mp4", type: 'video', lat: 62.9, lng: 27.7,
                    route: [
                        {lat: 62.9, lng: 27.7, t: 0}, {lat: 62.902, lng: 27.705, t: 5}, 
                        {lat: 62.905, lng: 27.71, t: 10}, {lat: 62.908, lng: 27.70, t: 15}
                    ]
                }
            ]);
        });

    function kasitteleData(data) {
        // Lasketaan reittien nopeudet ja suunnat
        data.forEach(item => {
            const ext = item.name.split('.').pop().toLowerCase();
            if (!item.type) item.type = ['mp4', 'mov', 'avi'].includes(ext) ? 'video' : 'image';

            if (item.type === 'video' && item.route && item.route.length > 0) {
                let totalDist = 0;
                for (let i = 0; i < item.route.length; i++) {
                    let p = item.route[i];
                    if (i > 0) {
                        let pPrev = item.route[i-1];
                        let dist = laskeEtaisyys(pPrev.lat, pPrev.lng, p.lat, p.lng);
                        totalDist += dist;
                        let timeDiff = p.t - pPrev.t;
                        p.speed = timeDiff > 0 ? (dist / timeDiff) * 3.6 : 0;
                        p.bearing = p.speed > 1.0 ? laskeSuunta(pPrev.lat, pPrev.lng, p.lat, p.lng) : (pPrev.bearing || 0);
                    } else {
                        p.speed = 0; p.bearing = 0;
                    }
                    p.distance = totalDist; 
                }
            }
        });
        kaikkiData = data;
        paivitaKartta();
    }

    function paivitaKartta() {
        markerClusterGroup.clearLayers();
        reittiViivat.forEach(line => map.removeLayer(line));
        reittiViivat = [];
        tallennetutMerkit = {};

        const locFilter = document.querySelector('input[name="locFilter"]:checked').value;
        const typeFilter = document.querySelector('input[name="typeFilter"]:checked').value;

        let suodatettuData = kaikkiData.filter(item => {
            if (locFilter === 'has_loc' && (!item.lat || !item.lng)) return false;
            if (locFilter === 'no_loc' && (item.lat && item.lng)) return false;
            if (typeFilter === 'jpg' && item.type !== 'image') return false;
            if (typeFilter === 'video' && item.type !== 'video') return false;
            return true;
        });

        rakennaLista(suodatettuData, 'all-file-list', 'right-count', 'right');

        suodatettuData.forEach(item => {
            // UUSI: Piirretään videon lentoreitti ja korostus
            if (item.type === 'video' && item.route && item.route.length > 0) {
                const latlngs = item.route.map(p => [p.lat, p.lng]);
                const polyline = L.polyline(latlngs, { color: '#00ffff', weight: 6, opacity: 0.8, lineCap: 'round', transition: 'all 0.2s' }).addTo(map);
                
                polyline.on('mouseover', function() {
                    this.setStyle({ color: '#e0ffff', weight: 10, opacity: 1.0 });
                    this.bringToFront();
                });
                polyline.on('mouseout', function() {
                    this.setStyle({ color: '#00ffff', weight: 6, opacity: 0.8 });
                });
                polyline.on('click', () => soitaVideo(item));
                
                reittiViivat.push(polyline);
            }

            // Normaalit karttapisteet
            if (item.lat && item.lng) {
                let color = item.type === 'video' ? '#e74c3c' : '#f1c40f'; // Videoille eri värinen pallo
                let m = L.circleMarker([item.lat, item.lng], { radius: 8, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9 });
                
                let iconStr = item.type === 'video' ? '🎬' : '📸';
                let popupContent = `
                    <div class="adv-popup-header">${iconStr} ${item.name}</div>
                    ${item.type === 'image' 
                        ? `<img src="/media/${item.path}" class="adv-popup-img" onclick="avaaLightbox('${item.path}')">` 
                        : `<div class="adv-popup-img" style="display:flex;align-items:center;justify-content:center;background:#333;font-size:40px;" onclick="soitaVideoPolulla('${item.path}')">▶️</div>`
                    }
                `;
                m.bindPopup(popupContent, { minWidth: 220 });

                m.on('mouseover', function () { this.openPopup(); korostaRivi(item.path); });

                const safeId = item.path.replace(/[^a-zA-Z0-9]/g, '-');
                tallennetutMerkit[safeId] = m;
                markerClusterGroup.addLayer(m);
            }
        });

        paivitaNakyvat();
    }

    // --- VIDEON TOISTO JA DRONE-SEURANTA ---
    window.soitaVideoPolulla = function(path) {
        const item = kaikkiData.find(d => d.path === path);
        if (item) soitaVideo(item);
    }

    function soitaVideo(item) {
        if (!item.route || item.route.length === 0) return alert("Tällä videolla ei ole reittidataa.");
        
        activeVideoData = item;
        const player = document.getElementById('active-video');
        player.src = "/media/" + item.path; // Korvaa oikealla polulla jos testaat paikallisesti!
        
        // Kytketään myös placeholder-video jos ladataan mock-dataa jotta se pyörii:
        if(item.path === "drone_video.mp4") player.src = "https://www.w3schools.com/html/mov_bbb.mp4"; 
        
        document.getElementById('video-title').innerText = item.name;
        document.getElementById('video-player-container').style.display = 'block';
        
        const start = item.route[0];
        droneMarker.setLatLng([start.lat, start.lng]).addTo(map);
        map.flyTo([start.lat, start.lng], 14);
        
        player.play();
        korostaRivi(item.path);
    }

    window.suljeVideo = function() {
        document.getElementById('active-video').pause();
        document.getElementById('video-player-container').style.display = 'none';
        map.removeLayer(droneMarker);
        activeVideoData = null;
    };

    // Dronen animaatio videon ajan mukaan
    document.getElementById('active-video').ontimeupdate = function() {
        if (!activeVideoData || !activeVideoData.route || activeVideoData.route.length < 2 || !this.duration) return;
        
        const progress = this.currentTime / this.duration;
        const exactIdx = progress * (activeVideoData.route.length - 1);
        const idx1 = Math.floor(exactIdx);
        const idx2 = Math.min(idx1 + 1, activeVideoData.route.length - 1); 
        const partialProgress = exactIdx - idx1; 
        
        const p1 = activeVideoData.route[idx1];
        const p2 = activeVideoData.route[idx2];
        
        if (p1 && p2) {
            let currentLat = p1.lat + (p2.lat - p1.lat) * partialProgress;
            let currentLng = p1.lng + (p2.lng - p1.lng) * partialProgress;
            
            droneMarker.setLatLng([currentLat, currentLng]);
            
            if (idx1 !== idx2) {
                let pixel1 = map.latLngToContainerPoint([p1.lat, p1.lng]);
                let pixel2 = map.latLngToContainerPoint([p2.lat, p2.lng]);
                let angle = Math.atan2(pixel2.y - pixel1.y, pixel2.x - pixel1.x) * 180 / Math.PI;
                let pointer = document.getElementById('drone-pointer');
                if (pointer) pointer.style.transform = `rotate(${angle + 90}deg)`; 
            }

            document.getElementById('v-time').innerText = `⏱️ ${Math.floor(this.currentTime)} s`;
            if(p1.speed !== undefined) document.getElementById('v-speed').innerText = `🚀 ${Math.round(p1.speed)} km/h`;
            if(p1.distance !== undefined) document.getElementById('v-dist').innerText = `📏 ${Math.round(p1.distance)} m`; 
        }
    };


    // --- MUUT FUNKTIOT (Lista, Lightbox, Korostus) ---
    function rakennaLista(data, containerId, countId, prefix) {
        const c = document.getElementById(containerId);
        c.innerHTML = '';
        document.getElementById(countId).innerText = data.length;
        
        data.forEach(item => {
            let div = document.createElement('div');
            div.className = 'list-item';
            const safeId = item.path.replace(/[^a-zA-Z0-9]/g, '-');
            div.id = `${prefix}-${safeId}`;
            if (valittuPolku === item.path) div.classList.add('is-selected');

            let peukalo = item.type === 'video' ? 'https://via.placeholder.com/40x40/e74c3c/fff?text=▶️' : `/media/${item.path}`;
            div.innerHTML = `<img class="list-thumb" src="${peukalo}" onerror="this.src='https://via.placeholder.com/40'"><span>${item.name}</span>`;
            
            div.onmouseenter = () => korostaRivi(item.path, false);
            div.onclick = () => {
                if (item.type === 'video') soitaVideo(item);
                else avaaLightbox(item.path);
                
                if (item.lat) map.setView([item.lat, item.lng], 16);
            };
            c.appendChild(div);
        });
    }

    function paivitaNakyvat() {
        const bounds = map.getBounds();
        const nakyvat = kaikkiData.filter(d => d.lat && bounds.contains([d.lat, d.lng]));
        rakennaLista(nakyvat, 'local-file-list', 'left-count', 'left');
    }

    window.korostaRivi = function(path, scrollaa = true) {
        valittuPolku = path;
        document.querySelectorAll('.list-item.is-selected').forEach(el => el.classList.remove('is-selected'));
        const safeId = path.replace(/[^a-zA-Z0-9]/g, '-');
        const leftItem = document.getElementById(`left-${safeId}`);
        const rightItem = document.getElementById(`right-${safeId}`);
        if (leftItem) { leftItem.classList.add('is-selected'); if (scrollaa) leftItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
        if (rightItem) { rightItem.classList.add('is-selected'); if (scrollaa) rightItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    };

    map.on('moveend', paivitaNakyvat);

    // Lightbox kuvia varten
    let lightboxKuvat = [];
    let lightboxIndeksi = 0;

    window.avaaLightbox = function(path) {
        const klikattu = kaikkiData.find(d => d.path === path);
        if (!klikattu || klikattu.type === 'video') return;
        lightboxKuvat = kaikkiData.filter(d => d.lat === klikattu.lat && d.lng === klikattu.lng && d.type === 'image');
        if(lightboxKuvat.length === 0) lightboxKuvat = [klikattu];
        lightboxIndeksi = lightboxKuvat.findIndex(d => d.path === path);
        paivitaLightboxNakyma();
        document.getElementById('lightbox').style.display = 'flex';
    };

    window.suljeLightbox = function() { document.getElementById('lightbox').style.display = 'none'; };
    window.vaihdaKuva = function(suunta) {
        lightboxIndeksi += suunta;
        if (lightboxIndeksi < 0) lightboxIndeksi = lightboxKuvat.length - 1;
        if (lightboxIndeksi >= lightboxKuvat.length) lightboxIndeksi = 0;
        paivitaLightboxNakyma();
    };

    function paivitaLightboxNakyma() {
        const item = lightboxKuvat[lightboxIndeksi];
        document.getElementById('lightbox-img').src = `/media/${item.path}`;
        document.getElementById('lb-info').innerText = `${item.name} (${lightboxIndeksi + 1} / ${lightboxKuvat.length})`;
        const naytaNuolet = lightboxKuvat.length > 1 ? 'block' : 'none';
        document.getElementById('lb-prev').style.display = naytaNuolet;
        document.getElementById('lb-next').style.display = naytaNuolet;
        korostaRivi(item.path);
    }
    
    document.addEventListener('keydown', function(event) {
        if (document.getElementById('lightbox').style.display === 'flex') {
            if (event.key === "Escape") suljeLightbox();
            if (event.key === "ArrowRight") vaihdaKuva(1);
            if (event.key === "ArrowLeft") vaihdaKuva(-1);
        }
    });
</script>
</body>
</html>
